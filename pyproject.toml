[project]
name = "halbtax-plus-optimizer"
version = "0.2.0"
description = "Decide which SBB Halbtax PLUS package maximizes expected savings under spending uncertainty"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "rich>=15.0.0",
]

[project.scripts]
halbtax-plus = "halbtax_plus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["halbtax_plus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
