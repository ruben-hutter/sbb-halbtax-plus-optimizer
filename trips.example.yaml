# Example trip list for the Halbtax PLUS optimizer.
# Copy to trips.yaml and edit.
#
# frequency: "N/unit" or "N-M/unit" with unit = w (week), m (month), y (year)
#   "2/w"      -> exactly twice a week          -> 104 /year
#   "0-1/w"    -> at most once a week, often not -> 0-52 /year (x gets 0)
#   "1-2/m"    -> 12-24 /year
#
# price: ONE-WAY price in CHF - enter what you see in the SBB app, or omit
#        it and run with --fetch-prices (live lookup, overrides this field).
# roundtrip: true  -> the return journey is counted too (price stays one-way).
#                     Use this instead of entering A->B and B->A separately!
# price_type: "full" (default) = 2nd-class full fare, halved by the tool,
#             "halftax"        = you already entered the Halbtax price.
# class: 1 or 2 - enter the price for the class you actually travel in
#                 (no surcharge math: the price you enter is the price used)
# sparticket_fraction: 0..1 - share of journeys you expect to buy as cheap
#                 train-bound Sparbillette (needs --fetch-prices for their
#                 price; also settable per trip or globally via CLI flag)
#
# weeks_off: N   (top level, optional) weeks per year you buy no tickets at
#                all (military service, long absence, ...). All frequencies
#                are scaled by (52-N)/52. CLI: --weeks-off N overrides this.
#
# fetch_prices: true   (top level, optional) fetch live prices via the
#                sbb.ch GraphQL on every run - no --fetch-prices flag needed;
#                stale fares (>7 days cached) refresh automatically.
#                --no-fetch skips it for a single run.
#
# months: N      (top level, optional) how long you intend to keep this
#                usage, default 12. The spend estimate is scaled to the
#                horizon and recurring prices count per contract year
#                (Halbtax fee, GA annual). CLI: --months N overrides this.
#
# IMPORTANT: only list tickets bought through ELIGIBLE channels
# (SBB.ch, SBB Mobile, ZVV / BLS / Bernmobil webshops, incl. EasyRide).
# Counter tickets and other operators earn no PLUS bonus.

profile: adult        # or "youth" if you (or the friend) is under 25

trips:
  - from: Zürich HB
    to: Bern
    frequency: "2/w"
    price: 51.00
    price_type: full
    note: commute, Tue & Thu

  - from: Bern
    to: Basel
    frequency: "0-1/w"
    price: 35.00
    price_type: full
    note: sometimes on weekends

  - from: Zürich HB
    to: Genève
    frequency: "1-2/y"
    price: 89.00
    price_type: full

  - from: Bern
    to: Murten
    frequency: "2-3/m"
    roundtrip: true          # there and back, price is one-way
    price: 12.50
    price_type: halftax

  - from: Zürich HB
    to: Luzern
    frequency: "0-1/m"       # occasional, one-way only (e.g. continues elsewhere)
    price: 16.50
    price_type: halftax

  - from: Bern
    to: Interlaken
    frequency: "4/y"
    price: 26.00             # every trip needs a price - no estimator fallback
    price_type: halftax
